spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketly
    username: ticketly
    password: ticketly
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight-sql: true
  liquibase:
    change-log: classpath:db/changelog-master.xml
    enabled: true
    contexts: dev
logging:
  level:
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
