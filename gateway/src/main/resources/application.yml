server:
  port: ${SERVER_PORT:8080}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ticketing-service-events
              uri: lb://ticketing-service
              predicates:
                - Path=/events/**
              filters:
                - PrefixPath=/api/
            - id: ticketing-service-reservations
              uri: lb://ticketing-service
              predicates:
                - Path=/reservations/**
              filters:
                - PrefixPath=/api/
            - id: payment-service-payments
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
              filters:
                - PrefixPath=/api/
  application:
    name: gateway
eureka:
  client:
    service-url:
      defaultZone: ${DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true